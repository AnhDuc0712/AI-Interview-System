name: CD

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t ghcr.io/${{ github.repository }}/ai-interview-frontend:latest .
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t ghcr.io/${{ github.repository }}/ai-interview-backend:latest .
      - name: Build AI services image
        run: docker build -f docker/Dockerfile.ai-services -t ghcr.io/${{ github.repository }}/ai-interview-ai:latest .
